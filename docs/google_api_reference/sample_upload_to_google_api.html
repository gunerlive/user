<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ตัวอย่างอัปโหลดไฟล์ผ่าน Google_API กลาง</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-blue-50 p-4">
  <div class="max-w-xl mx-auto bg-white rounded-3xl p-6 shadow">
    <h1 class="text-2xl font-bold text-blue-900">ตัวอย่างอัปโหลดไฟล์</h1>

    
    <form method="post" enctype="multipart/form-data" class="mt-5 space-y-4">
      <input name="uploader_name" class="w-full border rounded-2xl p-3" placeholder="ชื่อผู้ส่งไฟล์">
      <textarea name="description" class="w-full border rounded-2xl p-3" placeholder="คำอธิบายไฟล์"></textarea>
      <input type="file" name="file" class="w-full border rounded-2xl p-3" required>
      <button class="w-full bg-blue-900 text-white rounded-2xl p-3 font-bold">อัปโหลด</button>
    </form>
  </div>
</body>
</html>
